<div
  class="modal-backdrop"
  *ngIf="show"
  [style.zIndex]="zIndex"
  (click)="onBackdropClick($event)">
  <div
    class="modal-container"
    [ngClass]="['modal-' + size, title ? '' : 'modal-container--headless']"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title ? 'app-modal-title' : null"
    (click)="$event.stopPropagation()">
    <div class="modal-header" *ngIf="title">
      <h2 id="app-modal-title" class="modal-title">{{ title }}</h2>
      <button
        *ngIf="closable"
        type="button"
        class="modal-close-btn"
        (click)="closeModal()"
        aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <button
      *ngIf="closable && !title"
      type="button"
      class="modal-close-btn modal-close-btn--floating"
      (click)="closeModal()"
      aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="modal-body" [class.modal-body--flush]="bodyPadding === 'none'">
      <ng-content></ng-content>
    </div>
  </div>
</div>
