<button
  (click)="onConnect()"
  [disabled]="loading"
  class="tiktok-connect-btn"
  type="button">
  <svg *ngIf="!loading" class="platform-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 00-.79-.05A6.34 6.34 0 003.15 15.2a6.34 6.34 0 0010.86 4.48V13.4a8.28 8.28 0 005.58 2.18V12.1a4.85 4.85 0 01-3.77-1.68V6.69h3.77z"/>
  </svg>
  <span *ngIf="loading" class="spinner-small"></span>
  <span>{{ loading ? 'Conectando...' : label }}</span>
</button>
<p *ngIf="errorMessage" class="connect-error">{{ errorMessage }}</p>
