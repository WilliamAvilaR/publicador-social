<div class="login-container">
  <div class="login-panel">
    <div class="logo-container">
      <img src="assets/logoSocial.png" alt="Social Automate Logo" class="logo-icon" />
      <h1 class="logo-text">Social Automate</h1>
    </div>

    <div class="separador-login"></div>

    <h2 class="welcome-title">Establecer contraseña</h2>
    <p class="welcome-subtitle">Crea una contraseña para tu cuenta.</p>

    <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

    <form *ngIf="!successMessage" [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <div class="input-group">
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="newPassword"
          placeholder="Nueva contraseña"
          class="input-field"
          autocomplete="new-password"
          [class.invalid]="isFieldInvalid('newPassword')"
        />
        <div *ngIf="isFieldInvalid('newPassword')" class="field-error">
          {{ getFieldError('newPassword') }}
        </div>
      </div>

      <div class="input-group">
        <input
          [type]="showConfirm ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Confirmar contraseña"
          class="input-field"
          autocomplete="new-password"
          [class.invalid]="isFieldInvalid('confirmPassword')"
        />
        <div *ngIf="isFieldInvalid('confirmPassword')" class="field-error">
          {{ getFieldError('confirmPassword') }}
        </div>
      </div>

      <button type="submit" class="login-button" [disabled]="isLoading || !token">
        {{ isLoading ? 'Guardando...' : 'Guardar contraseña' }}
      </button>
    </form>

    <p class="signup-link"><a routerLink="/login">Volver a iniciar sesión</a></p>
  </div>
</div>
