<div class="change-password-wrapper" [class.embedded]="embedded" [class.panel-layout]="panelLayout">
  <div class="change-password-panel" [class.embedded-panel]="embedded" [class.panel-layout-panel]="panelLayout">
    <div class="header" *ngIf="!embedded && !panelLayout">
      <h2 class="title">{{ panelTitle }}</h2>
      <p class="subtitle">{{ standaloneSubtitle }}</p>
    </div>

    <div class="panel-header" *ngIf="panelLayout">
        <h4 class="panel-title" [id]="isSetPasswordMode ? 'password-modal-setup-title' : 'password-modal-change-title'">{{ panelTitle }}</h4>
      <p class="panel-help">{{ panelHelpText }}</p>
    </div>

    <div *ngIf="successMessage" class="success-message">
      <svg class="success-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="22 4 12 14.01 9 11.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="success-content">
        <strong>¡Éxito!</strong>
        <p>{{ successMessage }}</p>
      </div>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div *ngIf="capabilitiesLoading" class="loading-hint">{{ loadingMessage }}</div>

    <form
      *ngIf="passwordFormReady"
      [formGroup]="changePasswordForm"
      (ngSubmit)="onSubmit()"
      class="change-password-form">
      <div class="input-group" *ngIf="requiresCurrentPassword">
        <label for="currentPassword" class="input-label">Contraseña actual</label>
        <div class="password-input-wrap">
          <svg *ngIf="!panelLayout" class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input
            id="currentPassword"
            [type]="showCurrentPassword ? 'text' : 'password'"
            formControlName="currentPassword"
            placeholder="Contraseña actual"
            class="input-field"
            [class.input-field--panel]="panelLayout"
            [class.invalid]="isFieldInvalid('currentPassword')"
          />
          <button type="button" class="toggle-password" (click)="toggleCurrentPassword()" aria-label="Mostrar u ocultar contraseña">
            <svg *ngIf="!showCurrentPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12S5 4 12 4S23 12 23 12S19 20 12 20S1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg *ngIf="showCurrentPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C7 20 2.73 16.39 1 12C2.73 7.61 7 4 12 4C16.39 4 20.73 7.61 22 12C21.27 14.39 19.94 16.39 17.94 17.94Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M1 1L23 23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div *ngIf="isFieldInvalid('currentPassword')" class="field-error">
          {{ getFieldError('currentPassword') }}
        </div>
      </div>

      <div class="input-group">
        <label for="newPassword" class="input-label">{{ newPasswordLabel }}</label>
        <div class="password-input-wrap">
          <svg *ngIf="!panelLayout" class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input
            id="newPassword"
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="newPassword"
            [placeholder]="newPasswordLabel"
            class="input-field"
            [class.input-field--panel]="panelLayout"
            [class.invalid]="isFieldInvalid('newPassword')"
          />
          <button type="button" class="toggle-password" (click)="toggleNewPassword()" aria-label="Mostrar u ocultar contraseña">
            <svg *ngIf="!showNewPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12S5 4 12 4S23 12 23 12S19 20 12 20S1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg *ngIf="showNewPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C7 20 2.73 16.39 1 12C2.73 7.61 7 4 12 4C16.39 4 20.73 7.61 22 12C21.27 14.39 19.94 16.39 17.94 17.94Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M1 1L23 23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div *ngIf="isFieldInvalid('newPassword')" class="field-error">
          {{ getFieldError('newPassword') }}
        </div>
      </div>

      <div class="input-group">
        <label for="confirmNewPassword" class="input-label">{{ confirmPasswordLabel }}</label>
        <div class="password-input-wrap">
          <svg *ngIf="!panelLayout" class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input
            id="confirmNewPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmNewPassword"
            [placeholder]="confirmPasswordLabel"
            class="input-field"
            [class.input-field--panel]="panelLayout"
            [class.invalid]="isFieldInvalid('confirmNewPassword')"
          />
          <button type="button" class="toggle-password" (click)="toggleConfirmPassword()" aria-label="Mostrar u ocultar contraseña">
            <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12S5 4 12 4S23 12 23 12S19 20 12 20S1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C7 20 2.73 16.39 1 12C2.73 7.61 7 4 12 4C16.39 4 20.73 7.61 22 12C21.27 14.39 19.94 16.39 17.94 17.94Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M1 1L23 23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div *ngIf="isFieldInvalid('confirmNewPassword')" class="field-error">
          {{ getFieldError('confirmNewPassword') }}
        </div>
      </div>

      <div class="form-actions" [class.form-actions--panel]="panelLayout">
        <button *ngIf="!embedded || allowDismiss" type="button" class="cancel-button" (click)="onCancel()" [disabled]="isLoading">
          Cancelar
        </button>
        <button type="submit" class="submit-button" [disabled]="isLoading || !canSubmit">
          <span *ngIf="!isLoading">{{ submitLabel }}</span>
          <span *ngIf="isLoading">{{ isSetPasswordMode ? 'Estableciendo...' : 'Cambiando...' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
