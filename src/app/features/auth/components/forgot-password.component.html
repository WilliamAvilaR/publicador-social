<div class="login-container">
  <div class="login-panel">
    <div class="logo-container">
      <img src="assets/logoSocial.png" alt="Social Automate Logo" class="logo-icon" />
      <h1 class="logo-text">Social Automate</h1>
    </div>

    <div class="separador-login"></div>

    <h2 class="welcome-title">Recuperar contraseña</h2>
    <p class="welcome-subtitle">
      Introduce tu correo y te enviaremos instrucciones si la cuenta existe.
    </p>

    <div *ngIf="successMessage" class="success-message" role="status">
      <svg class="success-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="22 4 12 14.01 9 11.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="success-content">
        <p>{{ successMessage }}</p>
      </div>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
      <p *ngIf="cooldown.isActive" class="cooldown-hint">
        Podrás intentar de nuevo en {{ cooldown.secondsRemaining }} s
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 6L12 13L2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input
          type="email"
          formControlName="email"
          placeholder="name@example.com"
          class="input-field"
          autocomplete="email"
          [class.invalid]="isFieldInvalid('email')"
        />
        <div *ngIf="isFieldInvalid('email')" class="field-error">
          {{ getFieldError('email') }}
        </div>
      </div>

      <button type="submit" class="login-button" [disabled]="isSubmitDisabled">
        <span *ngIf="!isLoading && !cooldown.isActive">Enviar instrucciones</span>
        <span *ngIf="isLoading">Enviando...</span>
        <span *ngIf="!isLoading && cooldown.isActive">Reintentar en {{ cooldown.secondsRemaining }} s</span>
      </button>
    </form>

    <div class="separador-login"></div>

    <p class="signup-link"><a routerLink="/login">Volver a iniciar sesión</a></p>
  </div>
</div>
