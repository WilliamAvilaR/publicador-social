<section class="security-card email-change">
  <h3 class="card-title">Correo principal</h3>

  <div class="current-email-block">
    <span class="field-label">Correo actual</span>
    <p class="current-email">{{ currentEmail || '—' }}</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="email-form">
    <label for="newEmail" class="field-label">Nuevo correo electrónico</label>
    <div class="input-with-icon">
      <span class="input-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </span>
      <input
        id="newEmail"
        type="email"
        formControlName="newEmail"
        autocomplete="email"
        placeholder="Introduce tu nuevo correo electrónico"
      />
    </div>

    <div class="form-footer">
      <p class="form-hint">Te enviaremos un enlace de verificación al nuevo correo.</p>
      <button type="submit" class="btn-primary" [disabled]="submitting">
        {{ submitting ? 'Enviando...' : 'Enviar enlace de verificación' }}
      </button>
    </div>
  </form>
</section>
