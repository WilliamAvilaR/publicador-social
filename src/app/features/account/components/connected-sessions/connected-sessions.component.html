<section class="security-card connected-sessions">
  <div class="sessions-header">
    <div class="sessions-summary">
      <h3 class="card-title">Sesiones activas</h3>
      <div class="summary-row">
        <span class="summary-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3" y="4" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 20h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="summary-text">
          <p class="summary-main">{{ sessionSummary }}</p>
          <p class="summary-sub">Revisa y gestiona tus sesiones activas.</p>
        </div>
      </div>
    </div>

    <div class="session-actions">
      <button type="button" class="btn-outline" (click)="toggleSessionsList()" [disabled]="loading">
        {{ sessionsListOpen ? 'Ocultar sesiones' : 'Ver sesiones' }}
      </button>
      <button type="button" class="btn-outline" (click)="revokeOthers()" [disabled]="!!actionLoading || loading || sessionCount === 0">
        Cerrar sesiones en otros dispositivos
      </button>
      <button type="button" class="btn-danger-outline" (click)="revokeAll()" [disabled]="!!actionLoading || loading || sessionCount === 0">
        Cerrar todas las sesiones
      </button>
    </div>
  </div>

  <div class="sessions-list" *ngIf="sessionsListOpen && !loading">
    <div class="session-card" *ngFor="let session of sessions">
      <div>
        <strong>{{ session.deviceLabel }}</strong>
        <span *ngIf="session.isCurrent" class="badge current">Sesión actual</span>
        <div class="meta">
          <span *ngIf="session.ipAddress">IP: {{ session.ipAddress }}</span>
          <span>Última actividad: {{ session.lastSeenAt | date:'short' }}</span>
        </div>
      </div>
      <button
        *ngIf="session.isCurrent"
        type="button"
        class="btn-outline btn-outline--small"
        (click)="revokeCurrent(session)"
        [disabled]="!!actionLoading">
        Cerrar esta sesión
      </button>
    </div>

    <p *ngIf="sessions.length === 0" class="empty-state">No hay sesiones activas para mostrar.</p>
  </div>
</section>
